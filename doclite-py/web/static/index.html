<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocLite - 本地文档检索</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .search-hl { background: #fef08a; color: #000; padding: 0 2px; border-radius: 2px; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-4xl mx-auto px-4 py-10">
        <div class="flex justify-between items-center mb-2">
            <h1 id="appTitle" class="text-3xl font-bold text-gray-800">DocLite</h1>
            <button id="settingsBtn" class="p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-lg" title="设置">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </button>
        </div>
        <p class="text-gray-500 mb-8">本地离线文档全文检索工具</p>

        <!-- 设置弹窗 -->
        <div id="settingsModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white rounded-lg w-full max-w-2xl mx-4 max-h-[80vh] overflow-hidden">
                <div class="flex justify-between items-center p-4 border-b">
                    <h3 class="font-medium text-gray-800 text-lg">设置</h3>
                    <button id="closeSettingsModal" class="text-gray-500 hover:text-gray-700">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
                
                <div class="p-6 overflow-y-auto max-h-[60vh]">
                    <!-- 应用 Logo 设置 -->
                    <div class="mb-6">
                        <h4 class="font-medium text-gray-700 mb-3">应用名称</h4>
                        <input id="settingsAppName" type="text" placeholder="DocLite"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    </div>

                    <!-- Embedding 模型设置 -->
                    <div class="mb-6">
                        <h4 class="font-medium text-gray-700 mb-3">向量模型 (Embedding)</h4>
                        
                        <!-- 提供商选择 -->
                        <div class="mb-3">
                            <label class="block text-sm text-gray-600 mb-1">提供商</label>
                            <select id="settingsEmbeddingProvider" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                                <option value="local">本地模型 (sentence-transformers)</option>
                                <option value="ollama">Ollama (本地服务)</option>
                            </select>
                        </div>
                        
                        <!-- 本地模型选择 -->
                        <div id="localEmbeddingSection">
                            <label class="block text-sm text-gray-600 mb-1">模型</label>
                            <select id="settingsEmbeddingModel" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                                <option value="paraphrase-multilingual-MiniLM-L12-v2">MiniLM-L12 (多语言, 118MB)</option>
                                <option value="all-MiniLM-L6-v2">MiniLM-L6 (英文, 80MB)</option>
                                <option value="bge-small-zh-v1.5">BGE-small 中文 (80MB)</option>
                                <option value="bge-base-zh-v1.5">BGE-base 中文 (400MB)</option>
                            </select>
                            <p class="text-xs text-gray-500 mt-1">首次使用会自动下载模型，请确保网络连接</p>
                        </div>
                        
                        <!-- Ollama 模型配置 -->
                        <div id="ollamaEmbeddingSection" class="hidden">
                            <div class="mb-3">
                                <label class="block text-sm text-gray-600 mb-1">Ollama 地址</label>
                                <input id="settingsEmbeddingApiUrl" type="text" placeholder="http://localhost:11434"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                            </div>
                            <div class="mb-3">
                                <label class="block text-sm text-gray-600 mb-1">模型名称</label>
                                <input id="settingsEmbeddingApiModel" type="text" placeholder="nomic-embed-text"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                                <p class="text-xs text-gray-500 mt-1">需要先在 Ollama 中拉取模型: ollama pull nomic-embed-text</p>
                            </div>
                        </div>
                    </div>

                    <!-- API 模型设置 -->
                    <div class="mb-6">
                        <h4 class="font-medium text-gray-700 mb-3">对话模型 (API)</h4>
                        
                        <!-- API 提供商选择 -->
                        <div class="mb-3">
                            <label class="block text-sm text-gray-600 mb-1">提供商</label>
                            <select id="settingsApiProvider" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                                <option value="ollama">Ollama (本地)</option>
                                <option value="openai">OpenAI</option>
                                <option value="custom">自定义 API</option>
                            </select>
                        </div>
                        
                        <!-- API URL -->
                        <div class="mb-3">
                            <label class="block text-sm text-gray-600 mb-1">API 地址</label>
                            <input id="settingsApiUrl" type="text" placeholder="http://localhost:11434"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                        </div>
                        
                        <!-- API Key (OpenAI 需要) -->
                        <div id="apiKeySection" class="mb-3 hidden">
                            <label class="block text-sm text-gray-600 mb-1">API Key</label>
                            <input id="settingsApiKey" type="password" placeholder="sk-..."
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                        </div>
                        
                        <!-- 模型名称 -->
                        <div class="mb-3">
                            <label class="block text-sm text-gray-600 mb-1">模型名称</label>
                            <input id="settingsApiModel" type="text" placeholder="qwen2:1.5b"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                        </div>
                    </div>
                </div>
                
                <!-- 底部按钮 -->
                <div class="p-4 border-t bg-gray-50 flex justify-end gap-2">
                    <button id="cancelSettingsBtn" class="px-4 py-2 text-gray-600 hover:text-gray-800 rounded-lg">取消</button>
                    <button id="saveSettingsBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">保存设置</button>
                </div>
            </div>
        </div>

        <!-- 模式切换 -->
        <div class="flex justify-center mb-6">
            <div class="bg-gray-200 rounded-lg p-1">
                <button id="searchTab" class="px-4 py-2 rounded-md bg-white shadow-sm text-gray-800 font-medium">搜索</button>
                <button id="chatTab" class="px-4 py-2 rounded-md text-gray-600 hover:text-gray-800">问答</button>
            </div>
        </div>

        <!-- 文件夹选择区域 -->
        <div id="folderSection" class="mb-6">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-medium text-gray-700">扫描文件夹</h3>
                <button id="addFolderBtn" class="text-sm text-blue-600 hover:text-blue-800">+ 添加文件夹</button>
            </div>
            
            <!-- 已选文件夹列表 -->
            <div id="folderList" class="flex flex-wrap gap-2 mb-3">
                <div class="text-gray-400 text-sm">未选择任何文件夹</div>
            </div>
            
            <!-- 文件夹选择弹窗 -->
            <div id="folderModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                <div class="bg-white rounded-lg w-full max-w-2xl mx-4 overflow-hidden">
                    <div class="flex justify-between items-center p-4 border-b">
                        <h3 class="font-medium text-gray-800">选择文件夹</h3>
                        <button id="closeFolderModal" class="text-gray-500 hover:text-gray-700">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                    
                    <!-- 路径输入 -->
                    <div class="p-4 border-b">
                        <div class="flex gap-2">
                            <input id="folderPathInput" type="text" placeholder="输入文件夹路径..."
                                class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                            <button id="goToPathBtn" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 text-sm">前往</button>
                        </div>
                    </div>
                    
                    <!-- 目录浏览 -->
                    <div class="p-4">
                        <div id="breadcrumb" class="text-sm text-gray-500 mb-3"></div>
                        <div id="folderBrowser" class="h-64 overflow-y-auto border border-gray-200 rounded-lg">
                            <div class="text-center text-gray-400 py-10">加载中...</div>
                        </div>
                    </div>
                    
                    <!-- 底部按钮 -->
                    <div class="p-4 border-t bg-gray-50">
                        <button id="selectCurrentFolder" class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                            选择当前文件夹
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 搜索模式 -->
        <div id="searchMode">
            <!-- 搜索栏 -->
            <div class="flex gap-2 mb-6">
                <input id="searchInput" type="text" placeholder="输入关键词搜索文档..."
                    class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button id="buildBtn" class="px-4 py-3 bg-gray-600 text-white rounded-lg hover:bg-gray-700">
                    重建索引
                </button>
            </div>

            <!-- 结果统计 -->
            <div id="stats" class="text-gray-500 text-sm mb-4 hidden">
                共找到 <span id="totalCount">0</span> 条结果
            </div>

            <!-- 结果列表 -->
            <div id="resultList" class="space-y-3">
                <div id="searchLoading" class="text-center py-10 hidden">
                    <div class="inline-flex items-center gap-2 text-gray-500">
                        <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span>搜索中...</span>
                    </div>
                </div>
                <div id="searchEmpty" class="text-center text-gray-400 py-10">输入关键词开始搜索</div>
            </div>

            <!-- 分页控件 -->
            <div id="pagination" class="flex justify-center items-center gap-2 mt-6 hidden">
                <button id="prevBtn" class="px-3 py-1 text-sm bg-gray-200 rounded hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed">
                    上一页
                </button>
                <span id="pageInfo" class="text-sm text-gray-600">第 1 页</span>
                <button id="nextBtn" class="px-3 py-1 text-sm bg-gray-200 rounded hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed">
                    下一页
                </button>
            </div>
        </div>

        <!-- 问答模式 -->
        <div id="chatMode" class="hidden">
            <!-- 索引按钮 -->
            <div class="mb-4">
                <button id="ragIndexBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    构建 RAG 索引
                </button>
                <span id="ragIndexStatus" class="ml-2 text-sm text-gray-500"></span>
            </div>

            <!-- 聊天消息区域 -->
            <div id="chatMessages" class="bg-white rounded-lg border border-gray-200 p-4 mb-4 h-96 overflow-y-auto">
                <div class="text-center text-gray-400 py-10">输入问题开始问答</div>
            </div>

            <!-- 输入区域 -->
            <div class="flex gap-2">
                <input id="chatInput" type="text" placeholder="输入问题..."
                    class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button id="sendBtn" class="px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    发送
                </button>
            </div>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const resultList = document.getElementById('resultList');
        const stats = document.getElementById('stats');
        const totalCount = document.getElementById('totalCount');
        const buildBtn = document.getElementById('buildBtn');
        const pagination = document.getElementById('pagination');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageInfo = document.getElementById('pageInfo');
        const searchTab = document.getElementById('searchTab');
        const chatTab = document.getElementById('chatTab');
        const searchMode = document.getElementById('searchMode');
        const chatMode = document.getElementById('chatMode');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const ragIndexBtn = document.getElementById('ragIndexBtn');
        const ragIndexStatus = document.getElementById('ragIndexStatus');

        let timer = null;
        let currentPage = 1;
        let totalPages = 1;
        const perPage = 20;
        let chatHistory = [];
        let searchHistory = JSON.parse(localStorage.getItem('doclite_search_history') || '[]');
        let csrfToken = null;

        // ==================== 文件夹管理 ====================
        const addFolderBtn = document.getElementById('addFolderBtn');
        const folderList = document.getElementById('folderList');
        const folderModal = document.getElementById('folderModal');
        const closeFolderModal = document.getElementById('closeFolderModal');
        const folderPathInput = document.getElementById('folderPathInput');
        const goToPathBtn = document.getElementById('goToPathBtn');
        const breadcrumb = document.getElementById('breadcrumb');
        const folderBrowser = document.getElementById('folderBrowser');
        const selectCurrentFolder = document.getElementById('selectCurrentFolder');
        
        let currentBrowsePath = '/Users';  // macOS/Linux 默认路径
        let selectedFolders = [];

        // 加载已保存的文件夹
        async function loadFolders() {
            try {
                const res = await fetch('/api/folders/list');
                const data = await res.json();
                selectedFolders = data.folders || [];
                renderFolderList();
            } catch (e) {
                console.error('加载文件夹失败:', e);
            }
        }

        // 渲染文件夹列表
        function renderFolderList() {
            if (selectedFolders.length === 0) {
                folderList.innerHTML = '<div class="text-gray-400 text-sm">未选择任何文件夹</div>';
                return;
            }
            
            folderList.innerHTML = selectedFolders.map(folder => `
                <div class="flex items-center gap-1 bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm">
                    <span class="truncate max-w-48" title="${escapeHtml(folder)}">📁 ${escapeHtml(folder.split('/').pop())}</span>
                    <button onclick="removeFolder('${escapeHtml(folder)}')" class="text-blue-600 hover:text-blue-800 ml-1">×</button>
                </div>
            `).join('');
        }

        // 添加文件夹
        async function addFolder(path) {
            try {
                const res = await fetchWithCsrf(`/api/folders/add?path=${encodeURIComponent(path)}`, { method: 'POST' });
                const data = await res.json();
                if (data.status === 'ok') {
                    selectedFolders = data.folders;
                    renderFolderList();
                } else {
                    alert(data.detail || '添加失败');
                }
            } catch (e) {
                alert('添加失败: ' + e.message);
            }
        }

        // 移除文件夹
        async function removeFolder(path) {
            try {
                const res = await fetchWithCsrf(`/api/folders/remove?path=${encodeURIComponent(path)}`, { method: 'POST' });
                const data = await res.json();
                if (data.status === 'ok') {
                    selectedFolders = data.folders;
                    renderFolderList();
                }
            } catch (e) {
                alert('移除失败: ' + e.message);
            }
        }

        // 浏览目录
        async function browseDirectory(path) {
            currentBrowsePath = path;
            folderPathInput.value = path;
            
            try {
                const res = await fetch(`/api/folders/browse?path=${encodeURIComponent(path)}`);
                const data = await res.json();
                
                if (data.status === 'ok') {
                    renderBreadcrumb(data.current_path);
                    renderFolderItems(data.items, data.parent_path);
                }
            } catch (e) {
                folderBrowser.innerHTML = '<div class="text-center text-red-500 py-10">加载失败</div>';
            }
        }

        // 渲染面包屑导航
        function renderBreadcrumb(path) {
            const parts = path.split('/').filter(p => p);
            let html = '<span class="cursor-pointer hover:text-blue-600" onclick="browseDirectory(\'/\')">/</span>';
            let currentPath = '';
            
            parts.forEach((part, index) => {
                currentPath += '/' + part;
                const pathCopy = currentPath;
                html += `<span class="cursor-pointer hover:text-blue-600" onclick="browseDirectory('${pathCopy}')">${escapeHtml(part)}</span>`;
                if (index < parts.length - 1) {
                    html += ' / ';
                }
            });
            
            breadcrumb.innerHTML = html;
        }

        // 渲染目录项
        function renderFolderItems(items, parentPath) {
            if (items.length === 0) {
                folderBrowser.innerHTML = '<div class="text-center text-gray-400 py-10">空目录</div>';
                return;
            }
            
            folderBrowser.innerHTML = items.map(item => `
                <div class="flex items-center px-3 py-2 hover:bg-gray-100 cursor-pointer ${item.is_dir ? '' : 'opacity-50'}"
                     onclick="${item.is_dir ? `browseDirectory('${escapeHtml(item.path)}')` : ''}">
                    <span class="mr-2">${item.is_dir ? '📁' : '📄'}</span>
                    <span class="text-sm truncate">${escapeHtml(item.name)}</span>
                </div>
            `).join('');
        }

        // 打开文件夹选择弹窗
        addFolderBtn.addEventListener('click', () => {
            folderModal.classList.remove('hidden');
            browseDirectory(currentBrowsePath || '/');
        });

        // 关闭弹窗
        closeFolderModal.addEventListener('click', () => {
            folderModal.classList.add('hidden');
        });

        // 点击背景关闭
        folderModal.addEventListener('click', (e) => {
            if (e.target === folderModal) {
                folderModal.classList.add('hidden');
            }
        });

        // 前往指定路径
        goToPathBtn.addEventListener('click', () => {
            const path = folderPathInput.value.trim();
            if (path) {
                browseDirectory(path);
            }
        });

        // 回车前往
        folderPathInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                goToPathBtn.click();
            }
        });

        // 选择当前文件夹
        selectCurrentFolder.addEventListener('click', () => {
            addFolder(currentBrowsePath);
            folderModal.classList.add('hidden');
        });

        // 初始化加载文件夹
        loadFolders();

        // ==================== CSRF 令牌 ====================
        // ==================== 设置管理 ====================
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettingsModal = document.getElementById('closeSettingsModal');
        const cancelSettingsBtn = document.getElementById('cancelSettingsBtn');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const settingsAppName = document.getElementById('settingsAppName');
        const settingsEmbeddingProvider = document.getElementById('settingsEmbeddingProvider');
        const settingsEmbeddingModel = document.getElementById('settingsEmbeddingModel');
        const settingsEmbeddingApiUrl = document.getElementById('settingsEmbeddingApiUrl');
        const settingsEmbeddingApiModel = document.getElementById('settingsEmbeddingApiModel');
        const localEmbeddingSection = document.getElementById('localEmbeddingSection');
        const ollamaEmbeddingSection = document.getElementById('ollamaEmbeddingSection');
        const settingsApiProvider = document.getElementById('settingsApiProvider');
        const settingsApiUrl = document.getElementById('settingsApiUrl');
        const settingsApiKey = document.getElementById('settingsApiKey');
        const settingsApiModel = document.getElementById('settingsApiModel');
        const apiKeySection = document.getElementById('apiKeySection');
        const appTitle = document.getElementById('appTitle');

        // 加载设置
        async function loadSettings() {
            try {
                const res = await fetch('/api/settings/');
                const data = await res.json();
                if (data.status === 'ok') {
                    const settings = data.settings;
                    settingsAppName.value = settings.app_name || 'DocLite';
                    settingsEmbeddingProvider.value = settings.embedding_provider || 'local';
                    settingsEmbeddingModel.value = settings.embedding_model || 'paraphrase-multilingual-MiniLM-L12-v2';
                    settingsEmbeddingApiUrl.value = settings.embedding_api_url || 'http://localhost:11434';
                    settingsEmbeddingApiModel.value = settings.embedding_api_model || '';
                    settingsApiProvider.value = settings.api_provider || 'ollama';
                    settingsApiUrl.value = settings.api_base_url || 'http://localhost:11434';
                    settingsApiModel.value = settings.api_model || 'qwen2:1.5b';
                    appTitle.textContent = settings.app_name || 'DocLite';
                    updateApiKeyVisibility();
                    updateEmbeddingProviderVisibility();
                }
            } catch (e) {
                console.error('加载设置失败:', e);
            }
        }

        // 保存设置
        async function saveSettings() {
            const settings = {
                app_name: settingsAppName.value || 'DocLite',
                app_icon: '',
                embedding_provider: settingsEmbeddingProvider.value,
                embedding_model: settingsEmbeddingModel.value,
                embedding_api_url: settingsEmbeddingApiUrl.value,
                embedding_api_model: settingsEmbeddingApiModel.value,
                api_provider: settingsApiProvider.value,
                api_base_url: settingsApiUrl.value,
                api_key: settingsApiKey.value,
                api_model: settingsApiModel.value
            };
            
            try {
                const res = await fetchWithCsrf('/api/settings/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(settings)
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    appTitle.textContent = settings.app_name;
                    settingsModal.classList.add('hidden');
                    alert('设置已保存');
                } else {
                    alert('保存失败: ' + (data.detail || '未知错误'));
                }
            } catch (e) {
                alert('保存失败: ' + e.message);
            }
        }

        // 根据 API 提供商显示/隐藏 API Key 输入框
        function updateApiKeyVisibility() {
            const provider = settingsApiProvider.value;
            if (provider === 'openai' || provider === 'custom') {
                apiKeySection.classList.remove('hidden');
            } else {
                apiKeySection.classList.add('hidden');
            }
            
            // 更新默认 URL
            if (provider === 'ollama') {
                settingsApiUrl.value = 'http://localhost:11434';
                settingsApiModel.placeholder = 'qwen2:1.5b';
            } else if (provider === 'openai') {
                settingsApiUrl.value = 'https://api.openai.com/v1';
                settingsApiModel.placeholder = 'gpt-3.5-turbo';
            } else {
                settingsApiUrl.value = '';
                settingsApiModel.placeholder = '模型名称';
            }
        }

        // 根据 Embedding 提供商显示/隐藏相关配置
        function updateEmbeddingProviderVisibility() {
            const provider = settingsEmbeddingProvider.value;
            if (provider === 'local') {
                localEmbeddingSection.classList.remove('hidden');
                ollamaEmbeddingSection.classList.add('hidden');
            } else {
                localEmbeddingSection.classList.add('hidden');
                ollamaEmbeddingSection.classList.remove('hidden');
            }
        }

        // 打开设置弹窗
        settingsBtn.addEventListener('click', () => {
            settingsModal.classList.remove('hidden');
        });

        // 关闭设置弹窗
        closeSettingsModal.addEventListener('click', () => {
            settingsModal.classList.add('hidden');
        });

        cancelSettingsBtn.addEventListener('click', () => {
            settingsModal.classList.add('hidden');
        });

        // 点击背景关闭
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) {
                settingsModal.classList.add('hidden');
            }
        });

        // 保存设置
        saveSettingsBtn.addEventListener('click', saveSettings);

        // API 提供商变化时更新 UI
        settingsApiProvider.addEventListener('change', updateApiKeyVisibility);
        
        // Embedding 提供商变化时更新 UI
        settingsEmbeddingProvider.addEventListener('change', updateEmbeddingProviderVisibility);

        // 初始化加载设置
        loadSettings();

        // ==================== CSRF 令牌 ====================
        // 获取 CSRF 令牌
        async function getCsrfToken() {
            if (!csrfToken) {
                try {
                    const res = await fetch('/api/csrf-token');
                    const data = await res.json();
                    csrfToken = data.csrf_token;
                } catch (e) {
                    console.error('获取 CSRF 令牌失败:', e);
                    // 重试一次
                    try {
                        const res = await fetch('/api/csrf-token');
                        const data = await res.json();
                        csrfToken = data.csrf_token;
                    } catch (e2) {
                        console.error('重试获取 CSRF 令牌失败:', e2);
                    }
                }
            }
            return csrfToken;
        }

        // 带 CSRF 令牌的 fetch 封装
        async function fetchWithCsrf(url, options = {}) {
            // 每次请求都获取新的 CSRF 令牌
            csrfToken = null;
            const token = await getCsrfToken();
            if (!options.headers) {
                options.headers = {};
            }
            options.headers['x-csrf-token'] = token;
            return fetch(url, options);
        }

        // XSS 防护：转义 HTML 特殊字符
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 模式切换
        searchTab.addEventListener('click', () => {
            searchTab.classList.add('bg-white', 'shadow-sm', 'text-gray-800', 'font-medium');
            searchTab.classList.remove('text-gray-600');
            chatTab.classList.remove('bg-white', 'shadow-sm', 'text-gray-800', 'font-medium');
            chatTab.classList.add('text-gray-600');
            searchMode.classList.remove('hidden');
            chatMode.classList.add('hidden');
        });

        chatTab.addEventListener('click', () => {
            chatTab.classList.add('bg-white', 'shadow-sm', 'text-gray-800', 'font-medium');
            chatTab.classList.remove('text-gray-600');
            searchTab.classList.remove('bg-white', 'shadow-sm', 'text-gray-800', 'font-medium');
            searchTab.classList.add('text-gray-600');
            chatMode.classList.remove('hidden');
            searchMode.classList.add('hidden');
        });

        // RAG 索引
        ragIndexBtn.addEventListener('click', async () => {
            if (selectedFolders.length === 0) {
                alert('请先在上方选择要索引的文件夹');
                return;
            }
            
            ragIndexBtn.disabled = true;
            ragIndexBtn.textContent = '索引中...';
            ragIndexStatus.textContent = '正在构建 RAG 索引，请稍候...';
            try {
                const res = await fetchWithCsrf('/api/rag/index', { method: 'POST' });
                const data = await res.json();
                if (data.status === 'ok') {
                    ragIndexStatus.textContent = 'RAG 索引构建完成！';
                    setTimeout(() => { ragIndexStatus.textContent = ''; }, 3000);
                } else {
                    ragIndexStatus.textContent = '索引失败: ' + (data.detail || data.message || '未知错误');
                }
            } catch (e) {
                ragIndexStatus.textContent = '索引失败: 网络错误，请检查服务是否启动';
            } finally {
                ragIndexBtn.disabled = false;
                ragIndexBtn.textContent = '构建 RAG 索引';
            }
        });

        // 聊天发送
        sendBtn.addEventListener('click', doChat);
        chatInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                doChat();
            }
        });

        async function doChat() {
            const question = chatInput.value.trim();
            if (!question) return;

            // 显示用户问题
            chatHistory.push({ role: 'user', content: question });
            renderChatMessages();
            chatInput.value = '';
            sendBtn.disabled = true;

            // 显示加载状态
            chatHistory.push({ role: 'assistant', content: '思考中...', loading: true });
            renderChatMessages();

            try {
                const res = await fetchWithCsrf(`/api/chat?question=${encodeURIComponent(question)}`, { method: 'POST' });
                const data = await res.json();
                
                // 移除加载状态
                chatHistory.pop();
                
                // 显示回答
                chatHistory.push({ 
                    role: 'assistant', 
                    content: data.answer,
                    sources: data.sources,
                    confidence: data.confidence
                });
                renderChatMessages();
            } catch (e) {
                // 移除加载状态
                chatHistory.pop();
                
                chatHistory.push({ role: 'assistant', content: '抱歉，处理问题时出错。' });
                renderChatMessages();
            } finally {
                sendBtn.disabled = false;
            }
        }

        function renderChatMessages() {
            if (chatHistory.length === 0) {
                chatMessages.innerHTML = '<div class="text-center text-gray-400 py-10">输入问题开始问答</div>';
                return;
            }

            chatMessages.innerHTML = chatHistory.map(msg => {
                if (msg.role === 'user') {
                    return `
                        <div class="flex justify-end mb-4">
                            <div class="bg-blue-600 text-white px-4 py-2 rounded-lg max-w-3xl">
                                ${escapeHtml(msg.content)}
                            </div>
                        </div>
                    `;
                } else {
                    let sourcesHtml = '';
                    if (msg.sources && msg.sources.length > 0) {
                        sourcesHtml = `
                            <div class="mt-3 pt-3 border-t border-gray-200">
                                <div class="text-xs text-gray-500 mb-2">参考来源 (${msg.sources.length} 个)：</div>
                                ${msg.sources.map((s, idx) => `
                                    <div class="text-xs text-gray-600 mb-2 p-2 bg-gray-50 rounded">
                                        <div class="flex items-center gap-2 mb-1">
                                            <span class="font-medium">[${idx + 1}]</span>
                                            <span class="text-blue-600">${escapeHtml(s.filename)}</span>
                                            <span class="text-gray-400">(${escapeHtml(s.file_type)})</span>
                                            <span class="text-green-600">${(s.similarity * 100).toFixed(1)}% 匹配</span>
                                        </div>
                                        <div class="text-gray-500 line-clamp-2">${escapeHtml(s.excerpt)}</div>
                                        <button onclick="previewFile('${escapeHtml(s.path)}')" class="text-blue-500 hover:text-blue-700 mt-1">预览文件</button>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    }
                    if (msg.loading) {
                        return `
                            <div class="flex justify-start mb-4">
                                <div class="bg-gray-100 text-gray-800 px-4 py-2 rounded-lg max-w-3xl">
                                    <div class="flex items-center gap-2">
                                        <svg class="animate-spin h-4 w-4 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                        </svg>
                                        <span>${escapeHtml(msg.content)}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                    return `
                        <div class="flex justify-start mb-4">
                            <div class="bg-gray-100 text-gray-800 px-4 py-2 rounded-lg max-w-3xl">
                                <div class="whitespace-pre-wrap">${escapeHtml(msg.content)}</div>
                                ${sourcesHtml}
                            </div>
                        </div>
                    `;
                }
            }).join('');

            // 滚动到底部
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 保存搜索历史
        function saveSearchHistory(query) {
            if (!query) return;
            
            // 移除重复项
            searchHistory = searchHistory.filter(item => item !== query);
            
            // 添加到开头
            searchHistory.unshift(query);
            
            // 最多保留 10 条
            if (searchHistory.length > 10) {
                searchHistory = searchHistory.slice(0, 10);
            }
            
            localStorage.setItem('doclite_search_history', JSON.stringify(searchHistory));
        }

        // 显示搜索历史
        function showSearchHistory() {
            if (searchHistory.length === 0) return;
            
            const historyHtml = `
                <div class="absolute top-full left-0 right-0 bg-white border border-gray-200 rounded-lg mt-1 shadow-lg z-10">
                    <div class="p-2 text-xs text-gray-500 border-b">搜索历史</div>
                    ${searchHistory.map(item => `
                        <div class="px-3 py-2 hover:bg-gray-100 cursor-pointer text-sm" onclick="searchFromHistory('${escapeHtml(item)}')">
                            ${escapeHtml(item)}
                        </div>
                    `).join('')}
                </div>
            `;
            
            // 移除已有的历史下拉框
            const existingHistory = document.querySelector('.search-history');
            if (existingHistory) existingHistory.remove();
            
            // 添加新的历史下拉框
            const historyDiv = document.createElement('div');
            historyDiv.className = 'search-history relative';
            historyDiv.innerHTML = historyHtml;
            searchInput.parentNode.appendChild(historyDiv);
        }

        // 从历史记录搜索
        function searchFromHistory(query) {
            searchInput.value = query;
            const historyDiv = document.querySelector('.search-history');
            if (historyDiv) historyDiv.remove();
            doSearch();
        }

        // 隐藏搜索历史
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target)) {
                const historyDiv = document.querySelector('.search-history');
                if (historyDiv) historyDiv.remove();
            }
        });

        // 防抖搜索
        searchInput.addEventListener('input', () => {
            clearTimeout(timer);
            timer = setTimeout(doSearch, 300);
        });

        // 显示搜索历史
        searchInput.addEventListener('focus', showSearchHistory);

        // 回车搜索
        searchInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') doSearch();
        });

        // 重建索引
        buildBtn.addEventListener('click', async () => {
            if (selectedFolders.length === 0) {
                alert('请先在上方选择要索引的文件夹');
                return;
            }
            
            buildBtn.disabled = true;
            buildBtn.textContent = '构建中...';
            buildBtn.classList.add('opacity-50');
            try {
                const res = await fetchWithCsrf('/api/index/build', { method: 'POST' });
                const data = await res.json();
                if (data.status === 'ok') {
                    const count = data.scanned_files;
                    alert(count != null ? `索引构建完成，共扫描 ${count} 个文件` : '索引构建已启动');
                } else {
                    alert('构建失败: ' + (data.message || data.detail || '未知错误'));
                }
            } catch (e) {
                alert('构建失败: 网络错误，请检查服务是否启动');
            } finally {
                buildBtn.disabled = false;
                buildBtn.textContent = '重建索引';
                buildBtn.classList.remove('opacity-50');
            }
        });

        // 分页按钮事件
        prevBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                doSearch();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentPage < totalPages) {
                currentPage++;
                doSearch();
            }
        });

        async function doSearch() {
            const q = searchInput.value.trim();
            if (!q) {
                document.getElementById('searchLoading').classList.add('hidden');
                document.getElementById('searchEmpty').classList.remove('hidden');
                stats.classList.add('hidden');
                pagination.classList.add('hidden');
                return;
            }

            // 保存搜索历史
            saveSearchHistory(q);

            // 显示加载状态
            document.getElementById('searchLoading').classList.remove('hidden');
            document.getElementById('searchEmpty').classList.add('hidden');
            stats.classList.add('hidden');
            pagination.classList.add('hidden');

            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(q)}&page=${currentPage}&per_page=${perPage}`);
                const data = await res.json();
                renderResults(data);
            } catch (e) {
                document.getElementById('searchLoading').classList.add('hidden');
                document.getElementById('searchEmpty').textContent = '搜索出错，请重试';
                document.getElementById('searchEmpty').classList.remove('hidden');
            }
        }

        // 打开原文件
        async function openFile(filePath) {
            try {
                const res = await fetchWithCsrf(`/api/open?file_path=${encodeURIComponent(filePath)}`, { method: 'POST' });
                const data = await res.json();
                if (data.status === 'ok') {
                    // 成功打开，不显示提示
                } else {
                    alert('打开失败: ' + (data.detail || data.message || '未知错误'));
                }
            } catch (e) {
                alert('打开失败: 网络错误，请检查服务是否启动');
            }
        }

        // 文档预览
        async function previewFile(filePath) {
            try {
                const res = await fetch(`/api/preview?file_path=${encodeURIComponent(filePath)}`);
                const data = await res.json();
                
                if (!res.ok) {
                    alert('预览失败: ' + (data.detail || '未知错误'));
                    return;
                }
                
                // 创建预览模态框
                const modal = document.createElement('div');
                modal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
                modal.innerHTML = `
                    <div class="bg-white rounded-lg max-w-4xl max-h-[80vh] w-full mx-4 overflow-hidden">
                        <div class="flex justify-between items-center p-4 border-b">
                            <h3 class="font-medium text-gray-800">${escapeHtml(filePath.split('/').pop())}</h3>
                            <button onclick="this.closest('.fixed').remove()" class="text-gray-500 hover:text-gray-700">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>
                        <div class="p-4 overflow-y-auto max-h-[60vh]">
                            <pre class="whitespace-pre-wrap text-sm text-gray-700">${escapeHtml(data.content)}</pre>
                        </div>
                    </div>
                `;
                
                document.body.appendChild(modal);
                
                // 点击背景关闭
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        modal.remove();
                    }
                });
            } catch (e) {
                alert('预览失败: 网络错误，请检查服务是否启动');
            }
        }

        function renderResults(data) {
            // 隐藏加载状态
            document.getElementById('searchLoading').classList.add('hidden');

            stats.classList.remove('hidden');
            totalCount.textContent = data.total;

            if (data.results.length === 0) {
                document.getElementById('searchEmpty').textContent = '未找到匹配结果';
                document.getElementById('searchEmpty').classList.remove('hidden');
                pagination.classList.add('hidden');
                return;
            }

            document.getElementById('searchEmpty').classList.add('hidden');

            resultList.innerHTML = data.results.map(item => `
                <div class="bg-white p-4 rounded-lg border border-gray-200 hover:shadow-sm transition">
                    <div class="flex justify-between items-start mb-1">
                        <div class="font-medium text-blue-600 truncate" title="${escapeHtml(item.path)}">${escapeHtml(item.filename)}</div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs bg-gray-100 px-2 py-0.5 rounded text-gray-600 shrink-0">${escapeHtml(item.file_type)}</span>
                            <button onclick="previewFile('${escapeHtml(item.path)}')" class="text-xs text-blue-500 hover:text-blue-700">预览</button>
                            <button onclick="openFile('${escapeHtml(item.path)}')" class="text-xs text-green-500 hover:text-green-700">打开</button>
                        </div>
                    </div>
                    <div class="text-sm text-gray-600 line-clamp-2">${escapeHtml(item.snippet)}</div>
                    <div class="text-xs text-gray-400 mt-2 truncate">${escapeHtml(item.path)}</div>
                </div>
            `).join('');

            // 更新分页控件
            totalPages = Math.ceil(data.total / perPage);
            if (totalPages > 1) {
                pagination.classList.remove('hidden');
                pageInfo.textContent = `第 ${currentPage} / ${totalPages} 页`;
                prevBtn.disabled = currentPage <= 1;
                nextBtn.disabled = currentPage >= totalPages;
            } else {
                pagination.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
