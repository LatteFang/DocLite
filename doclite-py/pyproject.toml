[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doclite"
version = "0.6.0"
description = "极简本地离线文档全文检索工具"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "DocLite Team"}
]
keywords = ["document", "search", "rag", "offline", "local"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "whoosh>=2.7.4",
    "PyMuPDF>=1.20.0",
    "python-docx>=0.8.11",
    "python-multipart>=0.0.5",
    "sentence-transformers>=2.2.0",
    "numpy>=1.21.0",
    "python-pptx>=0.6.21",
    "openpyxl>=3.0.10",
    "requests>=2.28.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=9.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
doclite = "cli:main"

[project.urls]
Homepage = "https://github.com/your-username/doclite-py"
Documentation = "https://github.com/your-username/doclite-py#readme"
Repository = "https://github.com/your-username/doclite-py"
Issues = "https://github.com/your-username/doclite-py/issues"

[tool.setuptools.packages.find]
include = ["doclite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
